# Default inventory. Override with -i for real hosts.
#
# Real deployment example:
#   [guacamole]
#   guac01.example.com
#
# For the in-container test workflow the playbook runs against localhost with a
# local connection (see test/run.sh and README.md).

[guacamole]
localhost ansible_connection=local

[guacamole:vars]
ansible_python_interpreter=/usr/bin/python3
