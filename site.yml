---
# =============================================================================
# Apache Guacamole jump-host — full build for RHEL 9 / RHEL 10 (and OL/Rocky/Alma)
# Reimplementation of itiligent/Easy-Guacamole-Installer as Ansible roles.
#
#   ansible-playbook site.yml
#
# Tags: common, database, guacd, client, proxy, extensions
# =============================================================================
- name: Deploy Apache Guacamole
  hosts: guacamole
  become: true
  gather_facts: true

  pre_tasks:
    - name: Assert supported platform
      ansible.builtin.assert:
        that:
          - >-
            (ansible_os_family == "RedHat" and ansible_distribution_major_version | int in [9, 10])
            or
            (ansible_os_family == "Debian")
        fail_msg: >-
          Supported platforms: RHEL/Oracle/Rocky/Alma 9-10, Debian 12-13, Ubuntu 22.04/24.04
          (detected {{ ansible_distribution }} {{ ansible_distribution_version }}).
        success_msg: "{{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_os_family }}) OK"

  roles:
    - role: common
      tags: [common]
    - role: database
      tags: [database]
    - role: guacd
      tags: [guacd]
    - role: guacamole_client
      tags: [client]
    - role: nginx_proxy
      when: guac_install_nginx | bool
      tags: [proxy]
    - role: guac_extensions
      tags: [extensions]
    - role: backup
      tags: [backup]
    - role: hardening
      tags: [hardening]
    - role: connections
      tags: [connections]

  post_tasks:
    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Final smoke test — Guacamole web app
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/guacamole/"
        status_code: [200]
        timeout: 15
      register: _final_web
      until: _final_web.status == 200
      retries: 30
      delay: 5
      when: not (guac_container_build | bool)

    - name: Final smoke test — guacadmin login{{ ' via proxy' if guac_install_nginx | bool else '' }}
      ansible.builtin.uri:
        url: "{{ 'https://127.0.0.1/api/tokens' if guac_install_nginx | bool else 'http://127.0.0.1:8080/guacamole/api/tokens' }}"
        method: POST
        validate_certs: false
        timeout: 10
        body_format: form-urlencoded
        body:
          username: "{{ guac_default_admin_user }}"
          password: "{{ guac_default_admin_password }}"
        return_content: true
        status_code: [200]
      register: _final_auth
      failed_when: "'authToken' not in _final_auth.content"
      when: not (guac_container_build | bool)

    - name: Report endpoints
      ansible.builtin.debug:
        msg:
          - "Guacamole build complete."
          - "Direct:  http://{{ guac_proxy_site }}:8080/guacamole/"
          - "{{ 'Proxy:   https://' ~ guac_proxy_site ~ '/' if guac_install_nginx | bool else 'Reverse proxy disabled.' }}"
          - "Login:   {{ guac_default_admin_user }} / {{ guac_default_admin_password }}  (change immediately)"
