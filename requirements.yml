---
# Install with:  ansible-galaxy collection install -r requirements.yml
# Version ceilings keep these compatible with ansible-core 2.14 (EL9 'ansible' pkg)
# and ansible-core 2.16 (EL10 'ansible-core' pkg).
collections:
  - name: ansible.posix
    version: ">=1.5.4,<3.0.0"
  - name: community.mysql
    version: ">=3.7.0,<4.0.0"
  - name: community.general
    version: ">=8.0.0,<11.0.0"
