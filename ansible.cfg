[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
result_format = yaml
ansible_managed = Managed by Ansible (ansible-guacamole) - local edits will be overwritten
deprecation_warnings = False
interpreter_python = auto_silent
force_color = True

[privilege_escalation]
become = True
become_method = sudo

[ssh_connection]
pipelining = True
