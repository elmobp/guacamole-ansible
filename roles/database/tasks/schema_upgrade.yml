---
# Applies Guacamole JDBC schema upgrade scripts when the recorded schema version
# ({{ guac_schema_marker }}) is older than guac_version. If the marker is missing
# (database predates this tooling) we do NOT guess — no upgrade SQL is run and the
# marker is simply stamped at guac_version by the caller.

- name: Read recorded schema version
  ansible.builtin.slurp:
    src: "{{ guac_schema_marker }}"
  register: _marker_raw
  failed_when: false

- name: Determine if a schema upgrade is needed
  ansible.builtin.set_fact:
    _marker_ver: "{{ (_marker_raw.content | b64decode | trim) if (_marker_raw.content is defined) else '' }}"

- name: Apply schema upgrades
  when:
    - _marker_ver | length > 0
    - _marker_ver is version(guac_version, '<', strict=True)
  block:
    - name: Locate available upgrade scripts
      ansible.builtin.find:
        paths: "{{ guac_build_dir }}/guacamole-auth-jdbc-{{ guac_version }}/mysql/schema/upgrade"
        patterns: "upgrade-pre-*.sql"
      register: _upgrade_files

    - name: Select applicable upgrade scripts (ordered)
      ansible.builtin.set_fact:
        # String sort is adequate for the realistic Guacamole version range (1.x.y,
        # single-digit components). Filenames: upgrade-pre-<version>.sql
        _upgrades_to_apply: >-
          {{ _upgrade_files.files | map(attribute='path') | map('basename')
             | map('regex_replace', '^upgrade-pre-(.+)\.sql$', '\1') | list
             | select('version', _marker_ver, '>', strict=True)
             | select('version', guac_version, '<=', strict=True)
             | list | sort }}

    - name: Show upgrade plan
      ansible.builtin.debug:
        msg: "Schema upgrade {{ _marker_ver }} -> {{ guac_version }}: {{ _upgrades_to_apply }}"

    - name: Apply schema upgrade scripts in order
      community.mysql.mysql_db:
        name: "{{ guac_db_name }}"
        state: import
        target: "{{ guac_build_dir }}/guacamole-auth-jdbc-{{ guac_version }}/mysql/schema/upgrade/upgrade-pre-{{ item }}.sql"
        login_user: "{{ _db_login.login_user }}"
        login_password: "{{ _db_login.login_password | default(omit) }}"
        login_host: "{{ _db_login.login_host | default(omit) }}"
        login_port: "{{ _db_login.login_port | default(omit) }}"
        login_unix_socket: "{{ _db_login.login_unix_socket | default(omit) }}"
      loop: "{{ _upgrades_to_apply }}"
