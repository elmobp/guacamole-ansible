---
guacd_build_toolchain:
  - build-essential
  - autoconf
  - automake
  - libtool
  - libtool-bin
  - pkg-config

# FreeRDP dev package: 3.x on newer releases, 2.x on older (matches reference logic)
guacd_freerdp_pkg: >-
  {{ 'freerdp3-dev'
     if ansible_distribution_release | lower in ['bookworm', 'trixie', 'forky', 'noble', 'oracular', 'plucky']
     else 'freerdp2-dev' }}

guacd_build_libs:
  - libcairo2-dev
  - libjpeg-dev
  - libpng-dev
  - libpango1.0-dev
  - libssh2-1-dev
  - libtelnet-dev
  - libvncserver-dev
  - libwebsockets-dev
  - libpulse-dev
  - libssl-dev
  - libvorbis-dev
  - libwebp-dev
  - libossp-uuid-dev
  - uuid-dev
  - "{{ guacd_freerdp_pkg }}"

guacd_build_libs_optional:
  - libavcodec-dev
  - libavformat-dev
  - libavutil-dev
  - libswscale-dev
