---
guacd_build_toolchain:
  - build-essential
  - autoconf
  - automake
  - libtool
  - libtool-bin
  - pkg-config

# FreeRDP dev package is resolved at runtime (freerdp3-dev where present, else freerdp2-dev)
# by roles/guacd/tasks/main.yml — see _freerdp_pkg.
guacd_freerdp_candidates:
  - freerdp3-dev
  - freerdp2-dev

guacd_build_libs:
  - libcairo2-dev
  - libjpeg-dev
  - libpng-dev
  - libpango1.0-dev
  - libssh2-1-dev
  - libtelnet-dev
  - libvncserver-dev
  - libwebsockets-dev
  - libpulse-dev
  - libssl-dev
  - libvorbis-dev
  - libwebp-dev
  - libossp-uuid-dev
  - uuid-dev

guacd_build_libs_optional:
  - libavcodec-dev
  - libavformat-dev
  - libavutil-dev
  - libswscale-dev
