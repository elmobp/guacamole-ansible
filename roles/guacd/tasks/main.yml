---
- name: Load OS-family variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Install guacd build toolchain
  ansible.builtin.package:
    name: "{{ guacd_build_toolchain }}"
    state: present
  register: _pkg_tc
  until: _pkg_tc is succeeded
  retries: 3
  delay: 20

- name: Install guacd required build libraries
  ansible.builtin.package:
    name: "{{ guacd_build_libs }}"
    state: present
  register: _pkg_libs
  until: _pkg_libs is succeeded
  retries: 3
  delay: 20

- name: Install FreeRDP dev headers (Debian family — try 3.x then 2.x)
  ansible.builtin.apt:
    name: "{{ item }}"
    state: present
  loop: "{{ guacd_freerdp_candidates }}"
  failed_when: false
  when: ansible_os_family == "Debian"

- name: Verify a FreeRDP dev package is installed (Debian family)
  ansible.builtin.shell: "dpkg -s freerdp3-dev >/dev/null 2>&1 || dpkg -s freerdp2-dev >/dev/null 2>&1"
  changed_when: false
  when: ansible_os_family == "Debian"

- name: Install guacd optional build libraries (best effort)
  ansible.builtin.package:
    name: "{{ item }}"
    state: present
  loop: "{{ guacd_build_libs_optional }}"
  failed_when: false
  changed_when: false

- name: Detect installed guacd build identity
  ansible.builtin.command: "cat {{ guac_server_prefix }}/.guacd_build_id"
  register: _guacd_bid
  changed_when: false
  failed_when: false

- name: Set build identity + flag
  ansible.builtin.set_fact:
    _guacd_build_id: "{{ ('src:' ~ guac_source_repo ~ '@' ~ guac_source_ref) if (guac_source_ref | length > 0) else ('release:' ~ guac_version) }}"
    _guacd_src_dir: "{{ (guac_build_dir ~ '/guacamole-server-src') if (guac_source_ref | length > 0) else (guac_build_dir ~ '/guacamole-server-' ~ guac_version) }}"

- name: Compute build flag
  ansible.builtin.set_fact:
    _guacd_needs_build: "{{ (_guacd_bid.stdout | default('')) != _guacd_build_id }}"

- name: Build and install guacamole-server
  when: _guacd_needs_build | bool
  block:
    - name: Install SCM tooling (source-ref build)
      ansible.builtin.package:
        name: "{{ ['git'] + (['libtool-ltdl-devel'] if ansible_os_family == 'RedHat' else []) }}"
        state: present
      when: guac_source_ref | length > 0

    - name: Checkout guacamole-server at ref
      ansible.builtin.git:
        repo: "{{ guac_source_repo }}"
        dest: "{{ _guacd_src_dir }}"
        version: "{{ guac_source_ref }}"
        depth: 1
        force: true
      when: guac_source_ref | length > 0

    - name: Autoreconf source tree
      ansible.builtin.command:
        cmd: autoreconf -fi
        chdir: "{{ _guacd_src_dir }}"
      when: guac_source_ref | length > 0
      changed_when: true

    - name: Download guacamole-server release tarball
      when: guac_source_ref | length == 0
      block:
        - name: Fetch server source (primary mirror)
          ansible.builtin.get_url:
            url: "{{ guacd_server_archive_url }}"
            dest: "{{ guac_build_dir }}/guacamole-server-{{ guac_version }}.tar.gz"
            mode: "0644"
      rescue:
        - name: Fetch server source (archive.apache.org fallback)
          ansible.builtin.get_url:
            url: "{{ guacd_server_archive_fallback_url }}"
            dest: "{{ guac_build_dir }}/guacamole-server-{{ guac_version }}.tar.gz"
            mode: "0644"

    - name: Unpack guacamole-server release tarball
      ansible.builtin.unarchive:
        src: "{{ guac_build_dir }}/guacamole-server-{{ guac_version }}.tar.gz"
        dest: "{{ guac_build_dir }}"
        remote_src: true
        creates: "{{ _guacd_src_dir }}/configure"
      when: guac_source_ref | length == 0

    - name: Apply custom RDP share/printer labels
      ansible.builtin.replace:
        path: "{{ _guacd_src_dir }}/src/protocols/rdp/settings.c"
        regexp: '{{ item.re }}'
        replace: '{{ item.rep }}'
      loop:
        - { re: 'IDX_CLIENT_NAME, "Guacamole RDP"', rep: 'IDX_CLIENT_NAME, "{{ guac_rdp_share_host }}"' }
        - { re: 'IDX_DRIVE_NAME, "Guacamole Filesystem"', rep: 'IDX_DRIVE_NAME, "{{ guac_rdp_share_label }}"' }
        - { re: 'IDX_PRINTER_NAME, "Guacamole Printer"', rep: 'IDX_PRINTER_NAME, "{{ guac_rdp_printer_label }}"' }
      failed_when: false

    - name: Configure guacamole-server
      ansible.builtin.command:
        cmd: "./configure --prefix={{ guac_server_prefix }} --with-systemd-dir=/etc/systemd/system {{ guac_server_configure_extra }}"
        chdir: "{{ _guacd_src_dir }}"
      environment:
        CFLAGS: "-Wno-error"
        # FreeRDP 3.x (Debian 13, Ubuntu 24.04+) headers emit -Wdeprecated-declarations
        # warnings; guacamole-server's ./configure feature probes run with -Werror, so
        # without this the FREERDP_HAS_CONTEXT probe fails and the RDP build breaks on
        # 'struct rdp_freerdp has no member named input'. CPPFLAGS lands after -Werror.
        CPPFLAGS: "{{ guac_server_configure_cppflags }}"
      changed_when: true

    - name: Compile guacamole-server
      ansible.builtin.command:
        cmd: "make -j{{ ansible_processor_vcpus | default(2) }}"
        chdir: "{{ _guacd_src_dir }}"
      changed_when: true

    - name: Install guacamole-server
      ansible.builtin.command:
        cmd: make install
        chdir: "{{ _guacd_src_dir }}"
      changed_when: true
      notify: Restart guacd

    - name: Refresh linker cache
      ansible.builtin.command: ldconfig
      changed_when: true

    - name: Record guacd build identity
      ansible.builtin.copy:
        dest: "{{ guac_server_prefix }}/.guacd_build_id"
        content: "{{ _guacd_build_id }}\n"
        owner: root
        group: root
        mode: "0644"

- name: Deploy guacd.conf
  ansible.builtin.template:
    src: guacd.conf.j2
    dest: "{{ guac_home }}/guacd.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart guacd

- name: Deploy guacd systemd unit
  ansible.builtin.template:
    src: guacd.service.j2
    dest: /etc/systemd/system/guacd.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd guacd
    - Restart guacd

- name: Finalize guacd service
  when: not (guac_container_build | bool)
  block:
    - name: Flush handlers (guacd must be up before client role)
      ansible.builtin.meta: flush_handlers

    - name: Ensure guacd is enabled and running
      ansible.builtin.service:
        name: guacd
        state: started
        enabled: true
