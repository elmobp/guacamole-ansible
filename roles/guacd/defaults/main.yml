---
# Build dependency lists are OS-family specific — see vars/RedHat.yml and vars/Debian.yml.

guacd_server_archive_url: "{{ guac_apache_dl_base }}/source/guacamole-server-{{ guac_version }}.tar.gz"
guacd_server_archive_fallback_url: "{{ guac_apache_archive_base }}/source/guacamole-server-{{ guac_version }}.tar.gz"

# Source-ref build (see group_vars/all.yml). Empty => release tarball.
guac_source_repo: "https://github.com/apache/guacamole-server"
guac_source_ref: ""

# CPPFLAGS for ./configure. The default silences FreeRDP 3.x deprecation warnings so
# guacamole-server's -Werror feature probes pass (needed on Debian 13 / Ubuntu 24.04+).
# Harmless on FreeRDP 2.x platforms (RHEL 9/10, Debian 12).
guac_server_configure_cppflags: "-Wno-error=deprecated-declarations"
