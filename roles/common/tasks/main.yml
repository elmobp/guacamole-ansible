---
- name: Load OS-family variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: RHEL-family repository + package setup
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_os_family == "RedHat"

- name: Debian-family package setup
  ansible.builtin.include_tasks: debian.yml
  when: ansible_os_family == "Debian"

# --- Live FIPS detection -----------------------------------------------
# Independent of guac_fips_enabled (which is this playbook's OWN opt-in to
# *turn on* FIPS): a host can already be FIPS-enabled before we ever touch it
# (org-mandated image/kickstart). Roles that hardcode non-FIPS-approved
# algorithms (e.g. curve25519/chacha20-poly1305 in SSH KEX/ciphers) need to
# know the kernel's actual live state, not just our toggle.
- name: Check live kernel FIPS state
  ansible.builtin.command: cat /proc/sys/crypto/fips_enabled
  changed_when: false
  failed_when: false
  register: _fips_live

- name: Set live FIPS fact
  ansible.builtin.set_fact:
    guac_fips_active: "{{ (_fips_live.stdout | default('0') | trim == '1') or (guac_fips_enabled | bool) }}"

# --- Container detection -------------------------------------------------
# A handful of sysctls (kernel.kptr_restrict, fs.suid_dumpable, ...) are
# host-global rather than per-namespace: writing them from inside a container
# either fails outright or silently no-ops depending on the runtime's
# privilege level, so the live value never actually matches what we asked
# for and every subsequent run reports changed=true forever. Only live-reload
# sysctls on a real host; still write the config file everywhere so a real
# boot (or a more privileged runtime) converges them correctly.
- name: Set container-detection fact
  ansible.builtin.set_fact:
    guac_in_container: >-
      {{ (guac_container_build | bool)
         or (ansible_virtualization_type | default('') in
             ['container', 'podman', 'docker', 'lxc', 'systemd-nspawn', 'wsl'])
         or ('container' in (ansible_virtualization_tech_guest | default([]))) }}

# --- Hostname / local DNS (optional) ---------------------------------------
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ guac_fqdn }}"
  when:
    - guac_manage_hostname | bool
    - not (guac_container_build | bool)

- name: Ensure /etc/hosts entry for this host
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\S+\s+{{ guac_fqdn | regex_escape() }}\b'
    line: "{{ ansible_default_ipv4.address | default('127.0.1.1') }} {{ guac_fqdn }} {{ guac_server_name }}"
    state: present
  when: guac_manage_hostname | bool

# --- SELinux (RHEL family, enforcing hosts only) --------------------------
- name: Query SELinux state
  ansible.builtin.command: getenforce
  changed_when: false
  failed_when: false
  register: _selinux

- name: Allow web server network connections (proxy to Tomcat)
  ansible.posix.seboolean:
    name: "{{ item }}"
    state: true
    persistent: true
  loop:
    - httpd_can_network_connect
    - httpd_can_network_relay
  when:
    - guac_manage_selinux | bool
    - not (guac_container_build | bool)
    - _selinux.stdout | default('Disabled') not in ['Disabled', '']

# --- guacd service account ----------------------------------------------
- name: Create locked-down guacd service account
  ansible.builtin.user:
    name: "{{ guac_guacd_account }}"
    system: true
    shell: /sbin/nologin
    home: "/var/lib/{{ guac_guacd_account }}"
    create_home: true
    password_lock: true
    comment: "Guacamole guacd daemon"

- name: Deny guacd account cron access
  ansible.builtin.lineinfile:
    path: /etc/cron.deny
    line: "{{ guac_guacd_account }}"
    create: true
    owner: root
    group: root
    mode: "0644"

- name: FreeRDP profile dir for guacd (certificate storage)
  ansible.builtin.file:
    path: "/var/lib/{{ guac_guacd_account }}/.config/freerdp"
    state: directory
    owner: "{{ guac_guacd_account }}"
    group: "{{ guac_guacd_account }}"
    mode: "0700"

# --- GUACAMOLE_HOME -----------------------------------------------------
- name: Create GUACAMOLE_HOME tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ guac_home }}"
    - "{{ guac_extensions_dir }}"
    - "{{ guac_lib_dir }}"

- name: Create shared guacd runtime dir
  ansible.builtin.file:
    path: /var/guacamole
    state: directory
    owner: "{{ guac_guacd_account }}"
    group: "{{ guac_guacd_account }}"
    mode: "0750"
