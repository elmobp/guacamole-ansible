---
# Upstream Guacamole context served by Tomcat
guac_proxy_upstream: "http://127.0.0.1:8080/guacamole/"
guac_proxy_client_max_body_size: "1024m"
# TLS 1.3 only, everywhere (HRD-04)
guac_proxy_ssl_protocols: "TLSv1.3"
# Content-Security-Policy. Guacamole needs inline styles/scripts + blob/data workers
# and websocket 'self'. Tighten per your environment if you can.
guac_proxy_csp: >-
  default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self'
  'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:;
  connect-src 'self' wss: ws:; worker-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'
