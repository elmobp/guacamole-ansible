---
guac_hardening_enabled: true
guac_hardening_level: "l2"          # l1 | l2  (l2 adds stricter, more intrusive controls)

# Keep password SSH auth working by default (set false for key-only hosts).
guac_hardening_ssh_password_auth: true
guac_hardening_ssh_permit_root: "no"

# Kernel module blacklist (CIS filesystem + removable media controls)
guac_hardening_blacklist_modules_l1: [cramfs, freevxfs, jffs2, hfs, hfsplus, squashfs, udf]
guac_hardening_blacklist_modules_l2: [usb-storage]

guac_hardening_install_auditd: true

# Time synchronisation (ISM: accurate time source). Uses chrony.
guac_hardening_time_sync: true
guac_hardening_ntp_servers: []        # empty => distro/cloud default pool

# Central log forwarding (ISM: event logs stored centrally). Empty => not configured.
guac_syslog_target: ""                # e.g. "logs.corp.example:6514" (TCP) or "@collector:514"
guac_syslog_protocol: "tcp"           # tcp | udp

# Automatic security patching (ISM: patch cadence). Off by default (change control).
guac_auto_patch: false

# FIPS: opt-in only. Enabling requires a reboot and can lock you out if the
# platform is not prepared. Ubuntu needs Ubuntu Pro (`pro enable fips-updates`).
guac_fips_enabled: false

# External log forwarding transport (used when guac_syslog_target is set)
guac_syslog_tls: false                 # TLS-wrap the syslog stream (recommended)
guac_syslog_relp: false                # use RELP (reliable) instead of plain omfwd
guac_syslog_tls_authmode: "x509/name"  # x509/name | x509/certvalid | anon
guac_syslog_tls_permitted_peer: ""     # expected collector CN/SAN (for x509/name)
guac_syslog_tls_ca: ""                 # PEM content — collector CA
guac_syslog_tls_cert: ""               # PEM content — client cert (mutual TLS, optional)
guac_syslog_tls_key: ""                # PEM content — client key
