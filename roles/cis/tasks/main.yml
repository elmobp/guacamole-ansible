---
# =============================================================================
# CIS Benchmark coverage — entry point.
#
# Every remediation below is guarded by:
#   * guac_cis_level      — "l2" runs the Level 2 controls as well as Level 1
#   * guac_cis_exclusions — CIS control IDs that are skipped (prefix matched)
#
# Exclusion matching is done with one pre-built regex, `cis_skip_re`, so each
# guard is a single readable, greppable expression:
#
#     when: not ('2.1.22' is search(cis_skip_re))
#
# The regex anchors at the start and requires the next character to be "." or
# end-of-string, so excluding "1.1.2" also excludes "1.1.2.1.3" but never
# "1.1.22". An empty exclusion list matches nothing.
# =============================================================================

- name: Load CIS OS-family variables
  ansible.builtin.include_vars: "{{ ansible_os_family }}.yml"

- name: Build the CIS control guards
  ansible.builtin.set_fact:
    cis_skip_re: "^(?:{{ guac_cis_exclusions | default([]) | map('string') | map('regex_escape') | join('|') }})(?:\\.|$)"
    cis_l2: "{{ (guac_cis_level | default('l2') | lower) == 'l2' }}"
    cis_in_container: >-
      {{ (guac_container_build | bool)
         or (ansible_virtualization_type | default('') in
             ['container', 'podman', 'docker', 'lxc', 'systemd-nspawn', 'wsl'])
         or ('container' in (ansible_virtualization_tech_guest | default([]))) }}

- name: Announce the benchmark being applied
  ansible.builtin.debug:
    msg: >-
      {{ cis_benchmark_name }} — profile "Server {{ 'Level 2' if cis_l2 | bool else 'Level 1' }}",
      {{ guac_cis_exclusions | default([]) | length }} control(s)
      excluded{{ ' (container mode — boot/mount/service controls are configured, not applied)' if cis_in_container | bool else '' }}.

- name: Ensure CIS drop-in directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/modprobe.d
    - /etc/sysctl.d
    - /etc/security/limits.d
    - /etc/profile.d
    - /etc/sudoers.d
    - /etc/audit/rules.d
    - /etc/systemd/journald.conf.d

- name: "Section 1 — initial setup"
  ansible.builtin.include_tasks: section1_initial_setup.yml

- name: "Section 2 — services"
  ansible.builtin.include_tasks: section2_services.yml

- name: "Section 3/4 — network and host firewall"
  ansible.builtin.include_tasks: section3_network.yml

- name: "Section 5 — access, authentication and authorisation"
  ansible.builtin.include_tasks: section5_access_auth.yml

- name: "Section 6 — logging and auditing"
  ansible.builtin.include_tasks: section6_logging_audit.yml

- name: "Section 7 — system maintenance"
  ansible.builtin.include_tasks: section7_system_maintenance.yml
