---
# =============================================================================
# Ansible Guacamole — master configuration
#
# Supported: RHEL/Oracle/Rocky/Alma 9-10, Debian 12-13, Ubuntu 22.04/24.04/26.04.
# Override any value in host_vars/<host>.yml, another group_vars file, or with -e.
# Full plain-English reference: docs/CONFIGURE.md
# Copy-paste examples for common setups: docs/SCENARIOS.md
# =============================================================================

# ---------------------------------------------------------------------------
# Versions (reference: 1-setup.sh)
# ---------------------------------------------------------------------------
guac_version: "1.6.0"
guac_mysql_connector_j_version: "9.3.0"
# Apache Tomcat (installed from the official binary tarball — RHEL has no stable pkg)
guac_tomcat_version: "9.0.121"
guac_tomcat_major: "9"

# Download mirrors
guac_apache_dl_base: "https://dlcdn.apache.org/guacamole/{{ guac_version }}"
guac_apache_archive_base: "https://archive.apache.org/dist/guacamole/{{ guac_version }}"
guac_tomcat_dl_base: "https://dlcdn.apache.org/tomcat/tomcat-{{ guac_tomcat_major }}/v{{ guac_tomcat_version }}/bin"
guac_tomcat_archive_base: "https://archive.apache.org/dist/tomcat/tomcat-{{ guac_tomcat_major }}/v{{ guac_tomcat_version }}/bin"
guac_mysql_connector_j_url: "https://repo1.maven.org/maven2/com/mysql/mysql-connector-j/{{ guac_mysql_connector_j_version }}/mysql-connector-j-{{ guac_mysql_connector_j_version }}.jar"

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
guac_home: "/etc/guacamole"                     # GUACAMOLE_HOME
guac_extensions_dir: "{{ guac_home }}/extensions"
guac_lib_dir: "{{ guac_home }}/lib"
guac_build_dir: "/usr/local/src/guacamole"      # source checkout / build area
guac_tomcat_home: "/opt/tomcat"                 # symlink -> versioned dir
guac_server_prefix: "/usr/local"                # guacd install prefix (make install)

# ---------------------------------------------------------------------------
# System identity (reference: SERVER_NAME / LOCAL_DOMAIN / PROXY_SITE)
# ---------------------------------------------------------------------------
guac_manage_hostname: false                     # set true to enforce hostname/domain
guac_server_name: "{{ ansible_hostname }}"
guac_local_domain: "guac.local"
guac_fqdn: "{{ guac_server_name }}.{{ guac_local_domain }}"
# DNS name the reverse proxy + TLS cert answer to
guac_proxy_site: "{{ guac_fqdn }}"

# ---------------------------------------------------------------------------
# Build / packaging behaviour
# ---------------------------------------------------------------------------
guac_container_build: false                      # true during image build: skip systemd service
                                                # start/enable, firewall and SELinux management

# Debian/Ubuntu: optionally point apt at a faster regional mirror.
#   Debian example:  http://kartolo.sby.datautama.net.id/debian
#   Ubuntu (arm64):  http://ports.ubuntu.com/ubuntu-ports
guac_apt_mirror: ""
guac_apt_security_mirror: "http://security.debian.org/debian-security"

# RHEL-family repo handling (ignored on Debian family)
guac_enable_epel: true
guac_enable_crb: true                           # CRB (EL9/10) / PowerTools
guac_enable_rpmfusion: false                    # only for ffmpeg-devel; optional codecs
guac_extra_build_packages: []

# ---------------------------------------------------------------------------
# Firewall (reference: ufw rules)
# ---------------------------------------------------------------------------
guac_manage_firewall: true
guac_firewall_extra_ports: []                   # e.g. ["3306/tcp"]

# ---------------------------------------------------------------------------
# SELinux
# ---------------------------------------------------------------------------
guac_manage_selinux: true                       # set booleans for nginx->tomcat proxy

# ---------------------------------------------------------------------------
# guacd service account (reference: GUACD_ACCOUNT)
# ---------------------------------------------------------------------------
guac_guacd_account: "guacd"
guac_guacd_bind_host: "127.0.0.1"
guac_guacd_bind_port: 4822
# Extra configure flags for guacamole-server ./configure
guac_server_configure_extra: ""                 # e.g. "--enable-allow-freerdp-snapshots"
# CPPFLAGS for ./configure — default silences FreeRDP 3.x deprecation warnings that
# would otherwise fail guacamole-server's -Werror feature probes (Debian 13, Ubuntu 24.04+).
guac_server_configure_cppflags: "-Wno-error=deprecated-declarations"

# ---------------------------------------------------------------------------
# Database (reference: INSTALL_MYSQL / MYSQL_* / GUAC_* / SECURE_MYSQL)
# ---------------------------------------------------------------------------
guac_install_mariadb: true                      # true = install a local MariaDB
                                                # false = use a separate/remote DB server (set guac_mysql_host)
guac_secure_mariadb: true                       # apply mysql_secure_installation-equivalent (local only)
guac_db_bootstrap: true                         # create the DB + user + import schema
                                                # set false if a DBA manages the database for you
guac_mysql_host: "localhost"                    # remote DB: set to the server's hostname/IP
guac_mysql_port: 3306
guac_db_name: "guacamole_db"
guac_db_user: "guacamole_user"
guac_db_password: "ChangeMe_GuacDB_2026"        # OVERRIDE in a vault for production
guac_mysql_root_password: "ChangeMe_Root_2026"  # local root pw OR remote admin pw used for bootstrap
guac_mysql_admin_user: "root"                   # admin account used to bootstrap a remote DB
guac_db_timezone: "UTC"                          # "" to skip timezone configuration entirely

# Database backup job (reference: backup-guacamole.sh + crontab)
guac_db_backup_enabled: true
guac_db_backup_dir: "/var/backups/guacamole"
guac_db_backup_retention_days: 30
guac_db_backup_schedule: "0 0 * * 1-5"

# ---------------------------------------------------------------------------
# RDP display labels (reference: RDP_SHARE_* / RDP_PRINTER_LABEL)
# ---------------------------------------------------------------------------
guac_rdp_share_host: "{{ guac_server_name }}"
guac_rdp_share_label: "RDP Share"
guac_rdp_printer_label: "RDP Printer"

# ---------------------------------------------------------------------------
# Reverse proxy / TLS (reference: INSTALL_NGINX / SELF_SIGN / LETS_ENCRYPT)
# ---------------------------------------------------------------------------
guac_install_nginx: true
guac_url_redirect: true                          # /  ->  /guacamole  (only when nginx disabled)
guac_tls_mode: "self-signed"                     # self-signed | letsencrypt | none

# Self-signed cert attributes (reference: CERT_* / RSA_KEYLENGTH)
guac_cert_rsa_keylength: 3072                    # ISM: RSA modulus >= 3072 preferred
guac_cert_country: "AU"
guac_cert_state: "Victoria"
guac_cert_location: "Melbourne"
guac_cert_org: "Itiligent"
guac_cert_ou: "I.T."
guac_cert_days: 3650
guac_ssl_cert_dir: "/etc/nginx/ssl/cert"
guac_ssl_key_dir: "/etc/nginx/ssl/private"

# Let's Encrypt (reference: LE_DNS_NAME / LE_EMAIL) — production only
guac_le_dns_name: ""
guac_le_email: ""

# ---------------------------------------------------------------------------
# Optional Guacamole extensions (reference: INSTALL_TOTP/DUO/LDAP/QCONNECT/HISTREC)
# ---------------------------------------------------------------------------
guac_totp_enabled: false
guac_duo_enabled: false
guac_ldap_enabled: false
guac_quickconnect_enabled: false
guac_histrec_enabled: false
guac_histrec_path: "/var/lib/guacamole/recordings"
guac_branding_enabled: false                     # dark-theme branding.jar

# ---------------------------------------------------------------------------
# Single sign-on / federated auth (guacamole-auth-sso archive).
# Each is an *identity* layer on top of the MySQL/JDBC extension: the SSO
# provider proves who you are, the database still holds connections + perms.
# Pick ONE primary method (or database-only). MFA (TOTP/Duo) can stack on top.
# Full property reference: docs/CONFIGURE.md.
# ---------------------------------------------------------------------------
guac_openid_enabled: false                        # OpenID Connect (Keycloak, Azure AD, Okta, Google…)
guac_saml_enabled: false                          # SAML 2.0 (ADFS, Azure AD, Okta, Shibboleth…)
guac_ssl_auth_enabled: false                      # X.509 client-certificate / smart-card auth
guac_cas_enabled: false                           # CAS (Apereo/Jasig)

# OpenID Connect — required: authorization_endpoint, jwks_endpoint, issuer, client_id, redirect_uri
guac_openid:
  authorization_endpoint: ""                      # https://idp.example.com/realms/x/protocol/openid-connect/auth
  jwks_endpoint: ""                               # https://idp.example.com/realms/x/protocol/openid-connect/certs
  issuer: ""                                      # https://idp.example.com/realms/x
  client_id: ""
  redirect_uri: ""                                # https://{{ guac_proxy_site }}/  (must match the IdP)
  username_claim_type: "email"                    # JWT claim used as the Guacamole username
  groups_claim_type: "groups"                     # JWT claim listing group membership (for RBAC)
  scope: "openid email profile"
  # optional / advanced:
  attributes_claim_type: ""
  allowed_clock_skew: ""                          # seconds (default 30)
  max_token_validity: ""                          # minutes (default 300)
  max_nonce_validity: ""                          # minutes (default 10)

# SAML 2.0 — required: callback_url, plus EITHER idp_metadata_url OR (idp_url + entity_id)
guac_saml:
  idp_metadata_url: ""                            # https://idp/.../metadata  OR  file:///etc/guacamole/idp-metadata.xml
  idp_url: ""                                     # base IdP URL (only if no metadata URL)
  entity_id: ""                                   # https://{{ guac_proxy_site }}/  (this SP's entity id)
  callback_url: ""                                # https://{{ guac_proxy_site }}/  (IdP posts the assertion here)
  group_attribute: "groups"                       # IdP attribute carrying group membership
  strict: true                                    # enforce signature/cert validation (false = testing only)
  debug: false
  compress_request: true
  compress_response: true
  x509_cert_path: ""                              # sign requests (optional)
  private_key_path: ""

# X.509 client-certificate auth. Guacamole needs a SEPARATE TLS vhost that does
# `ssl_verify_client` and forwards the verified cert. When guac_ssl_auth_manage_nginx
# is true the nginx role adds `ssl_verify_client optional` + the X-Client-* headers to
# the main vhost (fine for a lab / single hostname); production should use a dedicated
# wildcard `*.{{ guac_ssl_auth_domain }}` endpoint — see docs/CONFIGURE.md.
guac_ssl_auth:
  auth_uri: ""                                    # https://cert.example.com/   (vhost requiring the cert)
  primary_uri: ""                                 # https://guac.example.com/   (normal vhost)
  client_certificate_header: "X-Client-Certificate"
  client_verified_header: "X-Client-Verified"
  subject_username_attribute: "CN"                # DN attribute -> username
  subject_base_dn: ""                             # restrict acceptable subject DNs (optional)
  max_token_validity: ""                          # minutes (default 5)
  max_domain_validity: ""                         # minutes (default 5)
guac_ssl_auth_manage_nginx: true                  # add the cert-verifying vhost + header scrubbing to nginx
guac_ssl_auth_client_ca: ""                       # PEM bundle of the CA(s) that issue client certs (vault)
guac_ssl_auth_domain: ""                          # server_name for the cert vhost, e.g. "cert.guac.example.com"
                                                  #   (also serves *.<domain> for the ephemeral subdomains)

# CAS — required: authorization_endpoint, redirect_uri
guac_cas:
  authorization_endpoint: ""                      # https://cas.example.com/cas
  redirect_uri: ""                                # https://{{ guac_proxy_site }}/
  clearpass_key: ""                               # optional: path to PGP key to decrypt ClearPass creds

# LDAP settings (reference: add-auth-ldap.sh) — templated, NOT login-tested here
guac_ldap:
  hostname: "dc1.yourdomain.com dc2.yourdomain.com"
  port: 389
  username_attribute: "sAMAccountName"
  encryption_method: "none"
  search_bind_dn: "ad-account@yourdomain.com"
  search_bind_password: "ad-account-password"
  config_base_dn: "dc=domain,dc=com"
  user_base_dn: "OU=SomeOU,DC=domain,DC=com"
  user_search_filter: "(objectClass=user)(!(objectCategory=computer))"
  max_search_results: 200

# DUO settings (reference: guacamole.properties duo-* stubs) — fill for production
guac_duo:
  api_hostname: ""
  integration_key: ""
  secret_key: ""
  application_key: ""

# ---------------------------------------------------------------------------
# guacd daemon-side TLS (internal webapp <-> guacd link) — TLS 1.3
# ---------------------------------------------------------------------------
guac_guacd_tls_enabled: false                   # true => wrap guacd traffic in TLS

# ---------------------------------------------------------------------------
# Hardening (CIS-aligned) — see roles/hardening/defaults/main.yml for detail
# ---------------------------------------------------------------------------
guac_hardening_enabled: true
guac_hardening_level: "l2"                       # l1 | l2
guac_hardening_ssh_password_auth: true           # false = key-only SSH
guac_fips_enabled: false                         # opt-in; needs a reboot, can lock you out
guac_hardening_time_sync: true                   # chrony
guac_hardening_ntp_servers: []                   # [] => distro pool
guac_syslog_target: ""                           # "collector:6514" => forward all logs (central logging)
guac_syslog_protocol: "tcp"
guac_auto_patch: false                           # dnf-automatic / unattended-upgrades (security only)

# Guacamole web session inactivity timeout (minutes). 0 / "" => Guacamole default (60).
guac_session_timeout_minutes: 15

# ---------------------------------------------------------------------------
# Backup / BCP-DR — see roles/backup/defaults/main.yml
# ---------------------------------------------------------------------------
guac_backup_enabled: true
guac_backup_gpg_passphrase: ""                   # non-empty => AES-256 encrypt bundles
guac_backup_schedule_oncalendar: "*-*-* 00:30:00"  # systemd OnCalendar for guac-backup.timer

# ---------------------------------------------------------------------------
# Declarative connections / groups / users  (see docs/CONFIGURE.md + SCENARIOS.md)
# Define your backend RDP/VNC/SSH target servers here (usually in host_vars).
# Empty by default — the connections role is a no-op until you add entries.
# ---------------------------------------------------------------------------
guac_connection_groups: []
guac_connections: []
guac_users: []
guac_connections_prune: false                    # true => delete connections/users NOT listed above

# ---------------------------------------------------------------------------
# Default admin (created by the JDBC schema) — for post-install verification
# ---------------------------------------------------------------------------
guac_default_admin_user: "guacadmin"
guac_default_admin_password: "guacadmin"
guac_syslog_tls: false                            # TLS-wrap forwarded logs (set CA/cert/key below)
guac_syslog_relp: false                           # reliable RELP transport
guac_syslog_tls_permitted_peer: ""                # collector cert CN/SAN
guac_syslog_tls_ca: ""                            # PEM: collector CA  (vault)
guac_syslog_tls_cert: ""                          # PEM: client cert   (vault, optional mutual TLS)
guac_syslog_tls_key: ""                           # PEM: client key    (vault)

# Build guacamole-server (guacd) from a git ref instead of the release tarball.
# Empty => use the pinned release. Test this path on OL only.
guac_source_repo: "https://github.com/apache/guacamole-server"
guac_source_ref: ""                               # branch | tag | commit (e.g. "1.6.0", "main")

# RBAC — grant connections/groups to user groups that mirror LDAP group names.
guac_user_groups: []
# LDAP group RBAC also needs these keys in guac_ldap: group_base_dn, member_attribute,
# member_attribute_type (dn|uid), group_name_attribute (default cn).
