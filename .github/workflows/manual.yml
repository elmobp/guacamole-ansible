name: Operator manual (PDF)

on:
  push:
    branches: [main, master]
    paths:
      - "docs/manual/**"
      - "scripts/build-manual.sh"
      - ".github/workflows/manual.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "docs/manual/**"
      - "scripts/build-manual.sh"
      - ".github/workflows/manual.yml"
  workflow_dispatch:

concurrency:
  group: manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build guacamole-operations-manual.pdf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc

      - name: Install typst (PDF engine)
        run: |
          set -euo pipefail
          TAG="$(curl -fsSL https://api.github.com/repos/typst/typst/releases/latest | grep -m1 '"tag_name"' | cut -d '"' -f4)"
          VER="${TAG#v}"
          ASSET="typst-x86_64-unknown-linux-musl"
          curl -fsSL -o "${ASSET}.tar.xz" \
            "https://github.com/typst/typst/releases/download/${TAG}/${ASSET}.tar.xz"
          tar -xJf "${ASSET}.tar.xz"
          sudo install -m 0755 "${ASSET}/typst" /usr/local/bin/typst
          typst --version

      - name: Build the manual
        run: bash scripts/build-manual.sh

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: guacamole-operations-manual
          path: docs/manual/guacamole-operations-manual.pdf
          if-no-files-found: error

      - name: Attach PDF to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: docs/manual/guacamole-operations-manual.pdf
